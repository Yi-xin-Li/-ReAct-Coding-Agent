[project]
name = "mini-coding-agent"
version = "0.1.0"
description = "A small, understandable Python coding agent with a handwritten tool loop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2.10,<3",
    "rich>=13,<15",
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
